name: 今日一笑

# 每天自动生成并推送「今日一笑」，并把 App 里收藏的段子固化进仓库 —— 不依赖本地电脑。
#   Actions（编排）→ Worker（挑段子 / 合成音频 / 收藏快照）→ 提交数据文件
#
# 为什么不需要构建前端：页面是静态的，数据是运行时 fetch 的
# （data/featured.json 带 ?t= 防缓存、音频带 ?v=updatedAt），所以只需提交数据文件。
#
# 零配置：/daily/pick 是**按日期幂等**的，同一天重复调用返回同一条段子，
# 所以它没有可滥用面（别人最多提前触发今天本来就要挑的那条），默认不需要任何 token。
# 想加固就在 Worker 上 `wrangler secret put DAILY_TOKEN`，并在本仓库加一个同名 Secret。

on:
  schedule:
    # 08:07 北京时间 = 00:07 UTC。GitHub 的定时任务在高峰期可能延迟几分钟到半小时。
    - cron: '7 0 * * *'
  workflow_dispatch: # 也可以在 Actions 页面手动点一次（例如想立刻固化刚收藏的段子）

permissions:
  contents: write # 需要把生成的数据提交回仓库

# 同一时间只跑一个，避免两次运行互相覆盖
concurrency:
  group: daily-joke
  cancel-in-progress: false

env:
  WORKER: https://tts.qinxiang2.cn

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 云端先采一批新段子（冷却中或失败都不影响本次推送）
        continue-on-error: true
        run: |
          curl -sS -X POST "$WORKER/refresh?limit=10" -o refresh.json
          head -c 400 refresh.json || true

      # 收藏的段子必须留住：Worker 里存的是完整快照（含正文），这里把它固化进仓库。
      # 只增不减：已存在的 id 不动、绝不删除、绝不重排（失败也不阻塞下面的今日一笑）。
      - name: 把收藏的段子固化进仓库（只增不减）
        continue-on-error: true
        run: |
          curl -fsS "$WORKER/favorites" -o favorites.json
          python3 .github/scripts/daily.py favorites favorites.json data/jokes.json

      - name: 挑一条今天的段子
        id: pick
        run: |
          curl -fsS "$WORKER/daily/pick?token=${{ secrets.DAILY_TOKEN }}" -o pick.json
          cat pick.json
          # 字段不全时这个脚本会非零退出，不会带着空值往下走
          python3 .github/scripts/daily.py outputs pick.json >> "$GITHUB_OUTPUT"

      - name: 写入 data/featured.json
        run: python3 .github/scripts/daily.py featured pick.json data/featured.json

      - name: 合成音频
        run: |
          AUDIO='${{ steps.pick.outputs.audio }}'
          mkdir -p "$(dirname "$AUDIO")"
          # /tts 直接返回 mp3 字节；-f 让上游报错（JSON + 非 2xx）时立即失败
          curl -fsS "$WORKER/tts?id=${{ steps.pick.outputs.id }}&vcn=${{ steps.pick.outputs.vcn }}" \
            -H 'accept: audio/mpeg' -o "$AUDIO"
          SIZE=$(stat -c%s "$AUDIO")
          echo "音频 $AUDIO = $SIZE 字节"
          # 太小说明拿到的不是真音频（比如错误 JSON 被 -f 漏过），宁可失败也不要推一条哑的
          [ "$SIZE" -gt 2000 ] || { echo "音频只有 $SIZE 字节，判定为失败"; head -c 300 "$AUDIO"; exit 1; }

      - name: 清掉同一天的旧音频
        run: |
          D='${{ steps.pick.outputs.date }}'
          # 保险：日期为空时直接跳过，否则通配符会退化成 daily-*.mp3 把所有音频删光
          [ -n "$D" ] || { echo "没有日期，跳过清理"; exit 0; }
          YMD=$(echo "$D" | tr -d '-')
          NEW=$(basename '${{ steps.pick.outputs.audio }}')
          # 注意通配符里**不能**写成 daily-$YMD-*.mp3：那样会漏掉早期命名 daily-<ymd>.mp3
          find audio -name "daily-$YMD*.mp3" ! -name "$NEW" -print -delete || true

      # 用 always()：即使今天挑段子/合成失败，也要把已取到的收藏固化进仓库
      - name: 提交并推送
        if: always()
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/featured.json data/jokes.json audio
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          D='${{ steps.pick.outputs.date }}'
          I='${{ steps.pick.outputs.id }}'
          if [ -n "$D" ] && [ -n "$I" ]; then
            git commit -m "今日一笑 $D ($I)"
          else
            git commit -m "收藏入库 $(date -u +%F)"
          fi
          git push
